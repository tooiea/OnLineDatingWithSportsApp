<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 定義：ラジアルグラデーションと計算した弧のパス -->
  <defs>
    <!-- 外側背景用ラジアルグラデーション -->
    <radialGradient id="outerGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFC1CC" />
      <stop offset="100%" stop-color="#FFD9B3" />
    </radialGradient>
    <!-- 上部のアーチ（ブランド名用）：中心 (100,100) 半径60, 角度約200°～340° -->
    <!-- 計算結果： 
           start point: (100 + 60*cos(200°), 100 + 60*sin(200°)) ≈ (43.6, 79.5)
           end point:   (100 + 60*cos(340°), 100 + 60*sin(340°)) ≈ (156.4, 79.5)
    -->
    <path id="topArc" d="M43.6,79.5 A60,60 0 0,1 156.4,79.5" fill="none" />
    <!-- 下部のアーチ（キャッチフレーズ用）：逆向きの同じ半径の弧 -->
    <!-- ここは角度20°～160°（反転させて文字を内側に配置）
         start point: (100+60*cos(20°), 100+60*sin(20°)) ≈ (156.4,120.5)
         end point:   (100+60*cos(160°), 100+60*sin(160°)) ≈ (43.6,120.5)
    -->
    <path id="bottomArc" d="M156.4,120.5 A60,60 0 0,1 43.6,120.5" fill="none" />
  </defs>

  <!-- 外側の丸い背景（白いストローク付き） -->
  <circle cx="100" cy="100" r="95" fill="url(#outerGradient)" stroke="white" stroke-width="4" />

  <!-- 上部：ブランド名を上部アーチに沿って配置 -->
  <text font-family="Arial, sans-serif" font-size="7" fill="#333">
    <textPath xlink:href="#topArc" startOffset="50%" text-anchor="middle">
      OnLineDatingWithSports
    </textPath>
  </text>

  <!-- 中央：ハートモチーフ（出会いと絆の象徴） -->
  <path d="M100,70
           C90,50 60,50 60,80
           C60,110 100,130 100,130
           C100,130 140,110 140,80
           C140,50 110,50 100,70 Z"
        fill="white" stroke="#ccc" stroke-width="1" />

  <!-- 中央のアクセント：小さな赤い点 -->
  <circle cx="100" cy="80" r="3" fill="#FF6B6B" />

  <!-- 下部：キャッチフレーズを下部アーチに沿って配置 -->
  <text font-family="Arial, sans-serif" font-size="5.5" fill="#555">
    <textPath xlink:href="#bottomArc" startOffset="50%" text-anchor="middle">
      スポーツが人を寄り添わせ、優しさで温かな絆を紡ぐ
    </textPath>
  </text>
</svg>