version: 2.1

orbs:
  node: circleci/node@5

jobs:
  build-node:
    executor: node/default
    working_directory: ~/project/src/app
    steps:
      - checkout:
          path: ~/project
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Viteビルド
          command: npm run build
      - persist_to_workspace:
          root: ~/project
          paths:
            - .

  build-php:
    docker:
      - image: cimg/php:8.2
    working_directory: ~/project/src/app
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Composer install（本番用）
          command: composer install --no-dev -o
      - persist_to_workspace:
          root: ~/project
          paths:
            - .

  deploy:
    docker:
      - image: cimg/base:stable
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Install rsync
          command: sudo apt-get update && sudo apt-get install -y rsync

      - run:
          name: Laravel本体をrsyncで反映
          command: |
            rsync -avz --delete \
              --exclude '.env' \
              -e "ssh -o StrictHostKeyChecking=no" \
              ~/project/src/app/ \
              $SAKURA_SSH_USER@$SAKURA_SSH_HOST:/home/$SAKURA_SSH_USER/laravel-app/

      - run:
          name: www に Laravel public の全内容を配置
          command: |
            rsync -avz --delete \
              -e "ssh -o StrictHostKeyChecking=no" \
              ~/project/src/app/public/ \
              $SAKURA_SSH_USER@$SAKURA_SSH_HOST:/home/$SAKURA_SSH_USER/www/

      - run:
          name: www/index.php をリポジトリから配置
          command: |
            scp -o StrictHostKeyChecking=no \
              ~/project/src/app/www/index.php \
              $SAKURA_SSH_USER@$SAKURA_SSH_HOST:/home/$SAKURA_SSH_USER/www/

workflows:
  version: 2
  full_deploy:
    jobs:
      - build-node
      - build-php:
          requires:
            - build-node
      - deploy:
          requires:
            - build-php
          context: SAKURA_SSH
